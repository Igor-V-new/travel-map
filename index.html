<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Наша карта путешествий</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://api-maps.yandex.ru/v3/?apikey=0bad9a86-00c3-43e8-b7af-7807c0bf24ff&lang=ru_RU"></script>
</head>
<body>
    <div id="map"></div>

    <div id="panel">
        <h3>Добавить место</h3>
        <input type="text" id="placeName" placeholder="Название (город/место)" />
        <input type="text" id="placeDesc" placeholder="Описание (необязательно)" />
        <label class="file-label">
            <span id="fileLabelText">Выбрать фото</span>
            <input type="file" id="placePhoto" accept="image/*" />
        </label>
        <button id="addBtn">Добавить на карту</button>
        <p id="status"></p>

        <div class="divider"></div>

        <button id="exportBtn" class="secondary">Скачать резервную копию</button>
        <label class="secondary file-label">
            <span>Загрузить резервную копию</span>
            <input type="file" id="importInput" accept="application/json" />
        </label>
    </div>

    <script src="app.js"></script>
</body>
</html>
